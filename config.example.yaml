# 漫画翻译管线配置
# 复制此文件为 config.yaml 并填入你的配置（config.yaml 已 gitignore）

# 翻译引擎
llm:
  # 可选: ollama / api
  mode: ollama

  # Ollama 配置（mode: ollama 时生效）
  ollama:
    model: qwen3.5:9b
    base_url: http://localhost:11434
    timeout: 600

  # OpenAI 兼容 API 配置（mode: api 时生效）
  api:
    model: deepseek-chat
    base_url: https://api.deepseek.com
    # 通过环境变量设置，避免明文存储:
    #   Linux/Mac: export DEEPSEEK_API_KEY="sk-xxx"
    #   Windows:    set DEEPSEEK_API_KEY=sk-xxx
    api_key: "${DEEPSEEK_API_KEY}"
    timeout: 300
    max_retries: 8    # 失败重试次数（429/繁忙时更耐心）
    rps: 1            # 每秒最大请求数（保守，避免触发账号限流；配额高可调大）

# 气泡检测
bubble:
  conf_threshold: 0.25
  iou_threshold: 0.45
  model: models/bubble/yolo11n-seg-mixed-bubble.pt

# OCR
ocr:
  lang: en

# 翻译参数
translation:
  batch_size: 20     # 每批页数
  source_lang: en
  target_lang: zh
  style: western_comic  # western_comic / manga / webtoon
  workers: 2          # GUI 翻译并发 worker 数（保守，减少 429；配额高可调大）
  use_cache: true     # 复用翻译记忆 + 页面翻译缓存（重跑几乎免费）
  batch_delay: 0.0    # CLI 批处理批次间隔秒（0 = 不等待，仅限流时退避）

# 渲染
render:
  background_cleaning: true   # 整块擦除气泡内部再重填（对残留英文最彻底）
  inpaint:
    device: auto
    lama_model_path: models/lama/big-lama
    opencv_method: telea
    opencv_radius: 5
    provider: lama      # 修复引擎：lama（跨风格稳定，首次自动下载模型）/ opencv（快但对纹理背景易糊）
  mask:
    padding: 18         # 覆盖粗体笔画；仍残留可继续加大
    provider: ocr
    refinement:
      enabled: true
    smooth_kernel: 5
    text_ratio: 0.5
  target_lang: zh
  typography_font: comic
  background_cleaning: false
  fallback_to_source: false
  use_quality_service: true

# 项目
project:
  name: my_comic
  db: data/output/project.db
  cache_dir: data/cache
  output_dir: data/output