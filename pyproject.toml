[project]
name = "comic-translator"
version = "0.1.0"
description = "Product-grade manga/comic translation system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # --- 核心：包可导入 + CLI 可运行的最小必需集 ---
    "aiofiles>=24.0.0",
    "httpx>=0.28.0",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "openai>=1.60.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.15.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
# Web GUI（MangaFlow）
gui = ["gradio>=6.0.0"]

# OCR 引擎（至少安装一个）
ocr = ["easyocr>=1.7.2", "torch>=2.0.0"]          # 默认英文 OCR，GPU 加速可选
paddle = ["paddlepaddle>=3.0.0", "paddleocr>=2.9.0"]
manga-ocr = ["manga-ocr"]

# 检测 / GPU 推理
yolo = ["ultralytics>=8.0.0", "torch>=2.0.0", "torchvision>=0.15.0"]
gpu = ["onnxruntime-gpu>=1.17.0", "torch>=2.0.0", "torchvision>=0.15.0"]

# 渲染 / 修复 / 视觉（可选）
inpaint = ["simple-lama-inpainting>=0.1.0", "torch>=2.0.0"]
vision = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=0.20.0",
    "bitsandbytes>=0.43.0",
    "diffusers>=0.27.0",
]

# 开发 / 测试
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

# 一键安装全部（等价于 .venv310 运行环境）
all = [
    "gradio>=6.0.0",
    "easyocr>=1.7.2",
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.0",
    "manga-ocr",
    "ultralytics>=8.0.0",
    "onnxruntime-gpu>=1.17.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "simple-lama-inpainting>=0.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.20.0",
    "bitsandbytes>=0.43.0",
    "diffusers>=0.27.0",
]

[project.scripts]
comic-translator = "comic_translator.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comic_translator"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ARG", "BLE", "C4", "DTZ", "EM", "ERA", "FLY", "G", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "T10", "T20", "TCH", "TID", "TRY", "UP", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
