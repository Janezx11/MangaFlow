[project]
name = "comic-translator"
version = "0.1.0"
description = "Product-grade manga/comic translation system"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "pillow>=11.0.0",
    "opencv-python>=4.10.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "typer>=0.15.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "aiofiles>=24.0.0",
]

[project.optional-dependencies]
paddle = ["paddlepaddle>=3.0.0", "paddleocr>=2.9.0"]
manga-ocr = ["manga-ocr"]
yolo = ["ultralytics"]
vision = ["transformers>=4.40.0", "torch>=2.0.0", "accelerate>=0.20.0", "bitsandbytes>=0.43.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[project.scripts]
comic-translator = "comic_translator.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "ARG", "BLE", "C4", "DTZ", "EM", "ERA", "FLY", "G", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "T10", "T20", "TCH", "TID", "TRY", "UP", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
