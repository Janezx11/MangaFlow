project:
  default_style: western_comic
  source_language: en
  target_language: zh

ocr:
  provider: paddle_ocr
  providers:
    paddle_ocr:
      lang: en
      use_gpu: true
    manga_ocr:
      lang: ja

translation:
  provider: qwen
  prompt_builder: western_comic
  providers:
    qwen:
      client: ollama
      model: qwen3.5:9b
      temperature: 0.1
    deepseek:
      client: openai_compatible
      model: deepseek-chat
      base_url: https://api.deepseek.com
      api_key: "${DEEPSEEK_API_KEY}"
    sensenova:
      client: openai_compatible
      model: SenseNova-v6
      base_url: https://api.sensenova.cn/v1
      api_key: "${SENSENOVA_API_KEY}"

qa:
  provider: gemma
  providers:
    gemma:
      client: ollama
      model: gemma4:e4b
      temperature: 0.0

render:
  provider: opencv
  providers:
    opencv:
      font_path: data/fonts/NotoSansSC-Regular.ttf
      font_size: 16

cache:
  enabled: true
  provider: file
  providers:
    file:
      dir: data/cache
      ocr_ttl: 604800
      translation_ttl: 2592000
      render_ttl: 2592000

comic_style:
  western_comic:
    prompt_builder: western_comic
    bubble_detection: false
  manga:
    prompt_builder: manga
    bubble_detection: true
  webtoon:
    prompt_builder: webtoon
    bubble_detection: true

logging:
  level: INFO
  file: data/logs/translator.log
  rotation: 100 MB
  retention: 30 days
